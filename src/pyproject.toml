[project]
name = "src"
version = "0.1.0"
description = "Common modules for lambdas"
requires-python = ">=3.12"
dependencies = [
    "batch-event-job-monitor",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[batch,s3,sqs]>=1.37.36",
    "aws-lambda-powertools>=3.3.0",
    "aws-xray-sdk",
]

[tool.uv.sources]
# TODO: pin the v0.3.0 release wheel once it is published
batch-event-job-monitor = { git = "https://github.com/NASA-IMPACT/batch-event-job-monitor", rev = "603357cc9cc41775ca3a5bfd6d4ae5000807715b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
